name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vault-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the vault tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\vault.test.ps1
